project:
  type: website
  output-dir: docs

website:
  title: "Raymond(Wenrui) Wang"
  site-url: "https://raymondww.github.io"
  description: "Data Scientist & ML Engineer — projects, writing, and notes."
  navbar:
    background: "#0a0a0a"
    foreground: "#e8e6e0"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Blog"
        href: blog/index.qmd
    right:
      - text: "Resume"
        href: resume.pdf
      - text: "Email"
        href: mailto:raymond.w.wang@hotmail.com
      - icon: github
        href: https://github.com/raymondww
        aria-label: GitHub
      - icon: linkedin
        href: https://linkedin.com/in/raymondwwang
        aria-label: LinkedIn
  page-footer:
    background: "#0a0a0a"
    foreground: "#6b6960"
    left: "© 2026 Raymond(Wenrui) Wang"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: [darkly, styles.scss]
    toc: false
    page-layout: article
    title-block-banner: false
    anchor-sections: false
    smooth-scroll: true
    grid:
      body-width: 900px

execute:
  freeze: auto
